name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build the release binary
        run: cargo build --release --locked

      - name: Install gerbv
        run: sudo apt-get update && sudo apt-get install -y gerbv

      - name: Render Gerber layers in gerbv
        run: |
          set -euo pipefail
          rm -rf viewer-out
          mkdir -p viewer-out
          rendered=0
          while IFS= read -r board; do
            name=$(basename "$board" .json)
            ./target/release/fusible export "$board" --preset fab -o "viewer-out/$name" --skip-lint
            mkdir -p "viewer-out/$name/layers"
            unzip -q "viewer-out/$name/gerbers.zip" -d "viewer-out/$name/layers"
            for layer in "viewer-out/$name/layers"/*; do
              out="viewer-out/$name-$(basename "$layer").png"
              if ! grep -q "^%ADD" "$layer" && ! grep -q "^T[0-9]*C" "$layer"; then continue; fi
              status=0
              gerbv -x png -w 1600x1200 -o "$out" "$layer" > "$out.log" 2>&1 || status=$?
              unexpected=$(grep -vE 'Unknown RS-274X extension found %T[FAD]%|^$' "$out.log" || true)
              if [ "$status" -ne 0 ] || [ -n "$unexpected" ] || [ ! -s "$out" ]; then
                echo "gerbv rejected $layer (exit $status)"
                cat "$out.log"
                exit 1
              fi
              rendered=$((rendered + 1))
            done
          done < <(grep -l '"pcb_board"' examples/*.json)
          if [ "$rendered" -eq 0 ]; then
            echo "no Gerber layer was rendered"
            exit 1
          fi

      - name: Upload Gerber renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gerber-renders
          path: viewer-out/*.png
          if-no-files-found: warn
