name: action-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  intact:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - id: fuse
        uses: ./
        with:
          target: examples/circuit.json
          version: 0.16.0

      - name: Expect an intact fuse
        if: steps.fuse.outputs.fuse != 'intact'
        shell: bash
        run: |
          echo "::error::expected fuse=intact, got '${{ steps.fuse.outputs.fuse }}'"
          exit 1

  blown:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - id: fuse
        uses: ./
        continue-on-error: true
        with:
          target: examples/circuit-floating.json
          version: 0.16.0

      - name: Expect a blown fuse
        if: steps.fuse.outputs.fuse != 'blown'
        shell: bash
        run: |
          echo "::error::expected fuse=blown, got '${{ steps.fuse.outputs.fuse }}'"
          exit 1
