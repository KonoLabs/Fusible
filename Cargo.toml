[package]
name = "fusible"
version = "0.8.11"
edition = "2021"
description = "Electronic linter: a fuse that blows to block firmware code generation"
license = "MIT"
repository = "https://github.com/KonoLabs/Fusible"
readme = "README.md"
keywords = ["eda", "hardware", "kicad", "tscircuit", "linter"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
notify-debouncer-mini = "0.7.0"
rayon = "1.12.0"
rstar = "0.13.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tiny_http = "0.12.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
