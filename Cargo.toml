[package]
name = "fusible"
version = "0.1.0"
edition = "2021"
description = "Linter électronique : un fusible qui saute pour bloquer la génération firmware"
license = "MIT"
repository = "https://github.com/KonoLabs/Fusible"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
