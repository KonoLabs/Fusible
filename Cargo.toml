[package]
name = "fusible"
version = "0.2.0"
edition = "2021"
description = "Electronic linter: a fuse that blows to block firmware code generation"
license = "MIT"
repository = "https://github.com/KonoLabs/Fusible"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
